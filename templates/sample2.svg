<svg xmlns="http://www.w3.org/2000/svg" width="512" height="560" viewBox="0 0 512 560" role="img" aria-label="Ticket layout">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="50%" stop-color="#9b4dff"/>
      <stop offset="100%" stop-color="#ff2fb0"/>
    </linearGradient>
    <pattern id="barcode" width="6" height="40" patternUnits="userSpaceOnUse">
      <rect width="2" height="40" fill="#111"/>
      <rect x="3" width="1" height="40" fill="#111"/>
    </pattern>
  </defs>

  <!-- Glow background -->
  <rect x="0" y="0" width="512" height="560" fill="url(#glow)" opacity="0.6"/>

  <!-- Ticket body -->
  <rect x="0" y="0" width="512" height="560" fill="#fff" stroke="#111" stroke-width="2"/>

  <!-- Top punch -->
  <!-- removed punch (no rounded/cut detail) -->

  <!-- Header -->
  <rect x="12" y="20" width="488" height="90" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="24" y="56" fill="#6b7280" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">TICKET ID</text>
  <text x="24" y="84" fill="#111" font-family="Courier New, monospace" font-size="28" font-weight="700">BUG-402</text>
  <rect x="392" y="44" width="96" height="32" fill="#111"/>
  <text x="400" y="64" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">HIGH PRIORITY</text>

  <!-- Title + timestamp -->
  <text x="24" y="140" fill="#111" font-family="Arial, sans-serif" font-size="30" font-weight="800">Login Failure</text>
  <text x="24" y="160" fill="#6b7280" font-family="Courier New, monospace" font-size="11">TIMESTAMP: 2023-10-27 14:45:00 UTC</text>

  <!-- Description -->
  <rect x="12" y="180" width="488" height="106" fill="none" stroke="#111" stroke-width="3"/>
  <text x="24" y="204" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="600">
    <tspan x="24" dy="0">User cannot access the mainframe when 2FA is enabled.</tspan>
    <tspan x="24" dy="18">Critical error detected on node 4 during</tspan>
    <tspan x="24" dy="18">authentication handshake sequence.</tspan>
  </text>

  <!-- Assignee -->
  <rect x="12" y="300" width="488" height="84" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="1.5"/>
  <circle cx="44" cy="342" r="22" fill="#111"/>
  <text x="34" y="348" fill="#fff" font-family="Material Symbols Outlined, Arial" font-size="18">⚙</text>
  <text x="84" y="332" fill="#6b7280" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">ASSIGNED UNIT</text>
  <text x="84" y="352" fill="#111" font-family="Arial, sans-serif" font-size="16" font-weight="700">Dev Unit 01</text>

  <!-- Footer -->
  <rect x="12" y="398" width="488" height="146" fill="#f9fafb" stroke="#111" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="24" y="420" fill="#9ca3af" font-family="Courier New, monospace" font-size="10" letter-spacing="2">SCAN TO TRACK</text>

  <!-- QR-like block -->
  <rect x="24" y="432" width="90" height="90" fill="#111"/>
  <rect x="28" y="436" width="82" height="82" fill="#fff"/>
  <rect x="28" y="436" width="41" height="41" fill="#111"/>
  <rect x="99" y="436" width="15" height="15" fill="#111"/>
  <rect x="82" y="453" width="15" height="15" fill="#111"/>
  <rect x="52" y="470" width="15" height="15" fill="#111"/>
  <rect x="99" y="470" width="15" height="15" fill="#111"/>
  <rect x="66" y="487" width="32" height="15" fill="#111"/>

  <!-- Barcode -->
  <rect x="332" y="430" width="140" height="40" fill="url(#barcode)" opacity="0.8"/>
  <text x="332" y="482" fill="#111" font-family="Courier New, monospace" font-size="10" letter-spacing="4">884-902-11</text>

  <!-- Decorative cuts -->
  <!-- removed decorative cuts -->
</svg>

