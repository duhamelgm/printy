<svg xmlns="http://www.w3.org/2000/svg" width="512" height="450" viewBox="0 0 512 450" role="img" aria-label="Ticket layout">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="50%" stop-color="#9b4dff"/>
      <stop offset="100%" stop-color="#ff2fb0"/>
    </linearGradient>
    <pattern id="barcode" width="6" height="40" patternUnits="userSpaceOnUse">
      <rect width="2" height="40" fill="#111"/>
      <rect x="3" width="1" height="40" fill="#111"/>
    </pattern>
  </defs>

  <!-- Glow background -->
  <rect x="0" y="0" width="512" height="650" fill="url(#glow)" opacity="0.6"/>

  <!-- Ticket body -->
  <rect x="0" y="0" width="512" height="650" fill="#fff" stroke="#111" stroke-width="2"/>

  <!-- Top punch -->
  <!-- removed punch (no rounded/cut detail) -->

  <!-- Header -->
  <rect x="0" y="0" width="512" height="150" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="24" y="40" fill="#6b7280" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">TICKET ID</text>
  <text x="24" y="88" fill="#111" font-family="Courier New, monospace" font-size="56" font-weight="700">{{.TicketID}}</text>
  <rect x="24" y="100" width="220" height="32" fill="#111"/>
  <text x="28" y="125" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">MEDIUM PRIORITY</text>

  <!-- Title + timestamp -->
  <text x="24" y="200" fill="#111" font-family="Arial, sans-serif" font-size="30" font-weight="800">{{.Title}}</text>
  <text x="24" y="230" fill="#6b7280" font-family="Courier New, monospace" font-size="18">TIMESTAMP: {{.Timestamp}}</text>


  <!-- Assignee -->
  <rect x="12" y="260" width="488" height="84" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
  <circle cx="44" cy="295" r="22" fill="#111"/>
  <text x="33" y="305" fill="#fff" font-family="Material Symbols Outlined, Arial" font-size="36">⚙</text>
  <text x="84" y="295" fill="#6b7280" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">ASSIGNED UNIT</text>
  <text x="84" y="320" fill="#111" font-family="Arial, sans-serif" font-size="24" font-weight="700">{{.Assignee}}</text>

  <!-- Footer -->
  <rect x="0" y="400" width="512" height="146" fill="#f9fafb" stroke="#111" stroke-width="2" stroke-dasharray="6 6"/>
</svg>

